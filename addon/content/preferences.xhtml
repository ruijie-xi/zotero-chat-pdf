<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl"/>
  <html:link rel="stylesheet" href="chrome://__addonRef__/content/chatpdf.css"/>
</linkset>
<groupbox class="chatpdf-preferences">
  <label><html:h2 data-l10n-id="pref-title"/></label>
  <description data-l10n-id="pref-save-hint"/>
  <html:section class="chatpdf-preference-section">
    <html:h3 data-l10n-id="pref-section-models"/>
    <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-llmProvider" data-l10n-id="pref-llm-provider"></html:label>
    <menulist id="zotero-prefpane-__addonRef__-llmProvider" preference="llmProvider" native="true">
      <menupopup>
        <menuitem value="deepseek" label="DeepSeek" />
        <menuitem value="opencode-go" label="OpenCode Go" />
        <menuitem value="custom" data-l10n-id="pref-llm-provider-custom" />
      </menupopup>
    </menulist>
  </hbox>
  <html:p id="zotero-prefpane-__addonRef__-providerHint" data-l10n-id="pref-llm-provider-go-hint" hidden="hidden" class="chatpdf-pref-help" />

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-llmApiBase" data-l10n-id="pref-llm-api-base"></html:label>
    <html:input type="text" id="zotero-prefpane-__addonRef__-llmApiBase" preference="llmApiBase" class="chatpdf-pref-flex" />
  </hbox>

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-llmApiKey" data-l10n-id="pref-llm-api-key"></html:label>
    <html:input type="password" id="zotero-prefpane-__addonRef__-llmApiKey" preference="llmApiKey" class="chatpdf-pref-flex" />
  </hbox>

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-llmModel" data-l10n-id="pref-llm-model"></html:label>
    <html:input type="text" id="zotero-prefpane-__addonRef__-llmModel" preference="llmModel" class="chatpdf-pref-flex" />
    <menulist id="zotero-prefpane-__addonRef__-providerModels" native="true" data-l10n-id="pref-llm-model-suggestions" class="chatpdf-pref-model-suggestions">
      <menupopup />
    </menulist>
  </hbox>

  <description data-l10n-id="pref-vision-inputs-hint"/>
  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-llmThinkingMode" data-l10n-id="pref-llm-thinking-mode"></html:label>
    <menulist id="zotero-prefpane-__addonRef__-llmThinkingMode" preference="llmThinkingMode" native="true" class="chatpdf-pref-select">
      <menupopup>
        <menuitem value="default" label="Default" />
        <menuitem value="enabled" label="Enabled" />
        <menuitem value="disabled" label="Disabled" />
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-llmThinkEffort" data-l10n-id="pref-llm-think-effort"></html:label>
    <menulist id="zotero-prefpane-__addonRef__-llmThinkEffort" preference="llmThinkEffort" native="true" class="chatpdf-pref-select">
      <menupopup>
        <menuitem value="default" label="Default" />
        <menuitem value="high" label="High" />
        <menuitem value="max" label="Max" />
      </menupopup>
    </menulist>
  </hbox>

  <vbox class="chatpdf-pref-spaced">
    <hbox align="center" class="chatpdf-pref-heading">
      <html:label data-l10n-id="pref-llm-test" class="chatpdf-pref-label"></html:label>
      <html:span class="chatpdf-pref-flex" />
      <html:button id="zotero-prefpane-__addonRef__-llmTestBtn" data-l10n-id="pref-test-button" class="chatpdf-pref-small-button"></html:button>
    </hbox>
    <html:textarea id="zotero-prefpane-__addonRef__-llmTestPrompt"
      class="chatpdf-pref-textarea"
      rows="2">Reply with exactly: ChatPDF LLM test OK.</html:textarea>
    <html:pre id="zotero-prefpane-__addonRef__-llmTestDebug"
      class="chatpdf-pref-debug" hidden="hidden"></html:pre>
  </vbox>
    <!-- Model Profiles -->
  <vbox>
    <hbox align="center" class="chatpdf-pref-heading">
      <html:label data-l10n-id="pref-model-profiles" class="chatpdf-pref-label"></html:label>
      <html:span class="chatpdf-pref-flex" />
      <html:button id="zotero-prefpane-__addonRef__-profileSaveBtn" data-l10n-id="pref-profile-save" class="chatpdf-pref-small-button"></html:button>
    </hbox>
    <html:div id="zotero-prefpane-__addonRef__-profileList" class="chatpdf-profile-list"></html:div>
    <hbox align="center" class="chatpdf-pref-compact-row">
      <html:label for="zotero-prefpane-__addonRef__-profileName" data-l10n-id="pref-profile-name"></html:label>
      <html:input type="text" id="zotero-prefpane-__addonRef__-profileName" data-l10n-id="pref-profile-placeholder" class="chatpdf-pref-flex" />
    </hbox>
    <html:span id="zotero-prefpane-__addonRef__-profileStatus" class="chatpdf-pref-status"></html:span>
  </vbox>
    <description data-l10n-id="pref-profile-save-hint"/>
    <hbox align="center">
      <html:label for="zotero-prefpane-__addonRef__-pdfTranscriptionProfile" data-l10n-id="pref-pdf-transcription-profile"/>
      <menulist id="zotero-prefpane-__addonRef__-pdfTranscriptionProfile" preference="pdfTranscriptionProfile" native="true" class="chatpdf-pref-select"><menupopup/></menulist>
    </hbox>
    <description data-l10n-id="pref-pdf-transcription-help"/>
    <html:p id="zotero-prefpane-__addonRef__-modelRoleStatus" class="chatpdf-preference-summary"/>
  </html:section>
  <html:section class="chatpdf-preference-section">
    <html:h3 data-l10n-id="pref-section-behavior"/>
    <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-agentMaxIterations" data-l10n-id="pref-agent-max-iterations"></html:label>
    <html:input type="number" id="zotero-prefpane-__addonRef__-agentMaxIterations" preference="agentMaxIterations" class="chatpdf-pref-number" min="1" />
  </hbox>

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-agentAutoContinue" data-l10n-id="pref-agent-auto-continue"></html:label>
    <html:input type="checkbox" id="zotero-prefpane-__addonRef__-agentAutoContinue" preference="agentAutoContinue" />
  </hbox>
  <html:details class="chatpdf-preference-advanced">
    <html:summary data-l10n-id="pref-tool-switches"/>
    <html:p data-l10n-id="pref-tool-switches-help"/>
    <html:div id="zotero-prefpane-__addonRef__-toolSwitches"/>
  </html:details>


  <description data-l10n-id="pref-library-edit-hint"/>
  <html:div id="zotero-prefpane-__addonRef__-webSettings"><hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-braveSearchApiKey" data-l10n-id="pref-brave-search-api-key"></html:label>
    <html:input type="password" id="zotero-prefpane-__addonRef__-braveSearchApiKey" preference="braveSearchApiKey" class="chatpdf-pref-flex" />
  </hbox></html:div>
    <html:details class="chatpdf-preference-advanced"><html:summary data-l10n-id="pref-section-prompt"/><vbox>
    <hbox align="center" class="chatpdf-pref-heading">
      <html:label data-l10n-id="pref-system-prompt" class="chatpdf-pref-label"></html:label>
      <html:span class="chatpdf-pref-flex" />
      <html:button id="zotero-prefpane-__addonRef__-promptResetEN" data-l10n-id="pref-prompt-default-en" class="chatpdf-pref-small-button"></html:button>
      <html:button id="zotero-prefpane-__addonRef__-promptResetCN" data-l10n-id="pref-prompt-default-zh" class="chatpdf-pref-small-button chatpdf-pref-next-button"></html:button>
    </hbox>
    <html:textarea id="zotero-prefpane-__addonRef__-systemPrompt"
      class="chatpdf-pref-textarea chatpdf-pref-prompt"
      rows="6"></html:textarea>
    <hbox pack="end" class="chatpdf-pref-spaced">
      <html:span id="zotero-prefpane-__addonRef__-promptStatus" class="chatpdf-pref-prompt-status"></html:span>
      <html:button id="zotero-prefpane-__addonRef__-promptSave" data-l10n-id="pref-prompt-save" class="chatpdf-pref-primary-button"></html:button>
    </hbox>
  </vbox></html:details>
  </html:section>
  <html:details class="chatpdf-preference-section chatpdf-preference-advanced">
    <html:summary data-l10n-id="pref-section-advanced"/>
    <description data-l10n-id="pref-limits-hint"/>
  <description data-l10n-id="pref-generation-hint"/>
  <hbox align="center"><html:label data-l10n-id="pref-context-window-tokens"/><html:input type="number" id="zotero-prefpane-__addonRef__-contextWindowTokens" preference="contextWindowTokens" min="0" step="1" class="chatpdf-pref-limit"/></hbox>
  <hbox align="center"><html:label data-l10n-id="pref-input-token-limit"/><html:input type="number" id="zotero-prefpane-__addonRef__-inputTokenLimit" preference="inputTokenLimit" min="0" step="1" class="chatpdf-pref-limit"/></hbox>
  <hbox align="center"><html:label data-l10n-id="pref-max-output-tokens"/><html:input type="number" id="zotero-prefpane-__addonRef__-maxOutputTokens" preference="maxOutputTokens" min="0" step="1" class="chatpdf-pref-limit"/></hbox>
  <hbox align="center"><html:label data-l10n-id="pref-requested-output-tokens"/><html:input type="number" id="zotero-prefpane-__addonRef__-requestedOutputTokens" preference="requestedOutputTokens" min="0" step="1" class="chatpdf-pref-limit"/></hbox>
  <hbox align="center"><html:label data-l10n-id="pref-image-token-reserve"/><html:input type="number" id="zotero-prefpane-__addonRef__-imageTokenReserve" preference="imageTokenReserve" min="0" step="1" class="chatpdf-pref-limit"/></hbox>
  <hbox align="center">
    <html:label data-l10n-id="pref-tokenizer-mode" />
    <menulist id="zotero-prefpane-__addonRef__-tokenizerMode" preference="tokenizerMode" native="true">
      <menupopup>
        <menuitem value="auto" label="Automatic (supported model only)" />
        <menuitem value="deepseek-v4-estimate" label="DeepSeek V4 local tokenizer estimate" />
      </menupopup>
    </menulist>
  </hbox>
  <html:button id="zotero-prefpane-__addonRef__-refreshModelLimits" data-l10n-id="pref-model-limits-refresh"/>
  <html:span id="zotero-prefpane-__addonRef__-modelLimitsStatus"/>
    <separator class="thin"/>
    <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-panelWidth" data-l10n-id="pref-panel-width"></html:label>
    <html:input type="number" id="zotero-prefpane-__addonRef__-panelWidth" preference="panelWidth" class="chatpdf-pref-width" min="280" step="10" />
  </hbox>

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-cacheDir" data-l10n-id="pref-cache-dir"></html:label>
    <html:input type="text" id="zotero-prefpane-__addonRef__-cacheDir" preference="cacheDir" class="chatpdf-pref-flex" />
  </hbox>

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-debugLogMode" data-l10n-id="pref-debug-log-mode"></html:label>
    <menulist id="zotero-prefpane-__addonRef__-debugLogMode" preference="debugLogMode" native="true" class="chatpdf-pref-select">
      <menupopup>
        <menuitem value="off" label="Off" />
        <menuitem value="metadata" label="Metadata only" />
        <menuitem value="full" label="Full content" />
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <html:label for="zotero-prefpane-__addonRef__-debugLogRetentionDays" data-l10n-id="pref-debug-log-retention"></html:label>
    <html:input type="number" id="zotero-prefpane-__addonRef__-debugLogRetentionDays" preference="debugLogRetentionDays" class="chatpdf-pref-number" min="1" max="365" />
  </hbox>
  </html:details>
</groupbox>
